[project]
name = "partyup-be"
version = "0.1.0"
description = "PartyUp BE project"
authors = [
    { name = "Valerio Santucci", email = "valerio.santucci.rm@gmail.com" }
]
requires-python = "==3.14.2"

dependencies = [
    "aiohttp>=3.13.3",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "elasticsearch==8.8.0",
    "fastapi>=0.128.0",
    "fastapi-mail>=1.6.1",
    "firebase-admin>=7.1.0",
    "functions-framework>=3.10.0",
    "geoalchemy2>=0.18.1",
    "google-cloud-logging>=3.13.0",
    "google-cloud-pubsub>=2.34.0",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "qrcode>=8.2",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.46",
    "sqlmodel>=0.0.31",
    "stripe>=14.2.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.1",
]
