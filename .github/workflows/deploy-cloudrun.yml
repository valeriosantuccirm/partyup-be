name: Deploy Cloud Run - Daily Payments

on:
  push:
    branches: [ main ]
    paths:
      - "cloud/cloud_funcs/daily_payments/**"
      - ".github/workflows/deploy-cloudrun.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q --maxfail=1 --disable-warnings

  deploy:
    needs: [test]

    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build Docker image
        working-directory: ./cloud/cloud_funcs/daily_payments
        run: |
          docker build -t europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/partyup-repo/daily-payments:$GITHUB_SHA .

      - name: Push Docker image
        run: |
          docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/partyup-repo/daily-payments:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy daily-payments-trigger \
            --image europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/partyup-repo/daily-payments:$GITHUB_SHA \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --service-account github-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --memory 512Mi --cpu 1

      - name: Test deployed endpoint
        run: |
          ENDPOINT=$(gcloud run services describe daily-payments-trigger --region europe-west1 --format='value(status.url)')
          echo "✅ Cloud Run deployed at: $ENDPOINT"
